<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Requisition Confirmation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-lg border-t-4 border-orange-500">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Lab Requisition Confirmation</h2>

    <!-- Search Section -->
    <div id="searchSection" class="space-y-4">
      <label class="block text-sm font-semibold text-gray-700">Registration Number or Order ID</label>
      <div class="flex gap-2">
        <input type="text" id="searchQuery" placeholder="Enter Reg No / Order ID..." class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-orange-500 outline-none">
        <button id="searchBtn" onclick="searchOrder()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2 rounded-md transition">Search</button>
      </div>
      <p id="searchStatus" class="text-center text-sm font-medium hidden"></p>
    </div>

    <!-- Order Details & Verification Section -->
    <div id="orderDetailsSection" class="hidden mt-6 space-y-4 border-t pt-4">
      <div class="bg-orange-50 border border-orange-200 rounded-lg p-4 space-y-2">
        <h3 class="text-md font-bold text-orange-600">Current Order Details</h3>
        <p class="text-sm"><strong>Order ID:</strong> <span id="dispOrderId"></span></p>
        <p class="text-sm"><strong>Reg No:</strong> <span id="dispRegNo"></span></p>
        <p class="text-sm"><strong>Student Name:</strong> <span id="dispName"></span></p>
        <p class="text-sm"><strong>Group:</strong> <span id="dispGroup"></span></p>
        <p class="text-sm"><strong>Item Selected:</strong> <span id="dispItem" class="font-bold"></span></p>
        <p class="text-sm"><strong>Quantity:</strong> <span id="dispQuantity" class="font-bold"></span></p>
        <p class="text-sm"><strong>Unit:</strong> <span id="dispUnit" class="font-bold text-orange-600"></span></p>
      </div>

      <!-- Live WebRTC Camera Section -->
      <div class="space-y-3">
        <label class="block text-sm font-semibold text-gray-700">Live Verification Photo</label>
        
        <!-- Live Camera Stream -->
        <video id="webcam" autoplay playsinline class="w-full h-56 bg-black rounded-lg hidden border object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>
        
        <!-- Captured Image Preview -->
        <div id="imagePreviewContainer" class="hidden mt-2 flex justify-center">
          <img id="imagePreview" src="" class="max-h-52 rounded-lg border shadow-sm">
        </div>

        <!-- Camera Controls -->
        <div class="flex gap-2">
          <button id="startCamBtn" onclick="startCamera()" type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-md transition">
            📷 Open Live Camera
          </button>
          <button id="captureBtn" onclick="takeSnapshot()" type="button" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-md hidden transition">
            📸 Take Photo
          </button>
        </div>

        <button id="confirmBtn" onclick="submitConfirmation()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-md mt-4 transition hidden">
          Confirm Receive
        </button>
      </div>
      <p id="uploadStatus" class="text-center text-sm font-medium hidden"></p>
    </div>
  </div>

  <script>
    // Updated Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbz0Ry_gVDYRuDPS1-kQkk3RjeloRlFvM3FyY7M-pIFIvCtXdXj-ym6CPud4F0XCZBnRZg/exec";
    
    let currentOrder = null;
    let base64Image = "";
    let stream = null;

    // 1. Search Order
    function searchOrder() {
      const query = document.getElementById('searchQuery').value.trim();
      const status = document.getElementById('searchStatus');
      const searchBtn = document.getElementById('searchBtn');

      if (!query) return;

      searchBtn.disabled = true;
      status.classList.remove('hidden');
      status.className = "text-center text-sm font-medium mt-2 text-orange-500";
      status.innerText = "Searching order...";

      fetch(`${API_URL}?action=searchOrder&query=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          searchBtn.disabled = false;
          if (data.result === "success" && data.orders.length > 0) {
            status.classList.add('hidden');
            currentOrder = data.orders[0]; 
            showOrderDetails(currentOrder);
          } else {
            status.className = "text-center text-sm font-medium mt-2 text-red-600";
            status.innerText = "No active order found or Access not granted!";
            document.getElementById('orderDetailsSection').classList.add('hidden');
          }
        })
        .catch(err => {
          searchBtn.disabled = false;
          status.className = "text-center text-sm font-medium mt-2 text-red-600";
          status.innerText = "Error searching order.";
        });
    }

    // 2. Display Order Details
    function showOrderDetails(order) {
      document.getElementById('dispOrderId').innerText = order.orderId;
      document.getElementById('dispRegNo').innerText = order.regNo;
      document.getElementById('dispName').innerText = order.name;
      document.getElementById('dispGroup').innerText = order.group;
      document.getElementById('dispItem').innerText = order.item;
      document.getElementById('dispQuantity').innerText = order.quantity;
      document.getElementById('dispUnit').innerText = order.unit || "N/A";
      
      // Reset camera view
      base64Image = "";
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      document.getElementById('confirmBtn').classList.add('hidden');
      document.getElementById('startCamBtn').innerText = "📷 Open Live Camera";
      document.getElementById('startCamBtn').classList.remove('hidden');
      document.getElementById('captureBtn').classList.add('hidden');
      
      document.getElementById('orderDetailsSection').classList.remove('hidden');
    }

    // 3. Start Live Camera Stream (WebRTC)
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: { exact: "environment" } } 
        });
      } catch (err) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        } catch (fallbackErr) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
        }
      }

      const video = document.getElementById('webcam');
      video.srcObject = stream;
      video.classList.remove('hidden');
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      
      document.getElementById('startCamBtn').classList.add('hidden');
      document.getElementById('captureBtn').classList.remove('hidden');
    }

    // 4. Take Live Snapshot & Add Watermark
    function takeSnapshot() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      // Frame draw on canvas
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Watermark Text Overlay
      const now = new Date();
      const timeString = "Verified: " + now.toLocaleString();
      
      context.font = "bold 16px sans-serif";
      context.fillStyle = "rgba(0, 0, 0, 0.6)";
      context.fillRect(10, canvas.height - 35, context.measureText(timeString).width + 20, 25);
      
      context.fillStyle = "#ffffff";
      context.fillText(timeString, 20, canvas.height - 18);

      // Base64 conversion
      base64Image = canvas.toDataURL('image/jpeg', 0.85);

      // Preview Display
      document.getElementById('imagePreview').src = base64Image;
      document.getElementById('imagePreviewContainer').classList.remove('hidden');

      // Stop camera stream
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      video.classList.add('hidden');
      document.getElementById('captureBtn').classList.add('hidden');
      document.getElementById('startCamBtn').innerText = "🔄 Retake Photo";
      document.getElementById('startCamBtn').classList.remove('hidden');
      document.getElementById('confirmBtn').classList.remove('hidden');
    }

    // 5. Gather Device Metadata & Browser Fingerprint
    async function getDeviceMetadata() {
      const userAgent = navigator.userAgent;
      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const language = navigator.language;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      const rawFingerprint = `${userAgent}|${screenRes}|${language}|${timeZone}|${navigator.hardwareConcurrency || ''}`;
      
      const msgBuffer = new TextEncoder().encode(rawFingerprint);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const fingerprintHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      return {
        deviceInfo: userAgent,
        screenSize: screenRes,
        fingerprint: fingerprintHash
      };
    }

    // 6. Submit Confirmation with Security Payload
    async function submitConfirmation() {
      if (!base64Image) {
        alert("Please capture a live photo first!");
        return;
      }

      const confirmBtn = document.getElementById('confirmBtn');
      const status = document.getElementById('uploadStatus');

      confirmBtn.disabled = true;
      confirmBtn.innerText = "Processing...";
      status.classList.remove('hidden');
      status.className = "text-center text-sm font-medium mt-2 text-orange-500";
      status.innerText = "Processing & verifying image...";

      const metadata = await getDeviceMetadata();

      const payload = {
        rowIndex: currentOrder.rowIndex,
        orderId: currentOrder.orderId,
        regNo: currentOrder.regNo,
        name: currentOrder.name,
        group: currentOrder.group,
        item: currentOrder.item,
        quantity: currentOrder.quantity,
        unit: currentOrder.unit,
        imageBase64: base64Image,
        deviceModel: metadata.deviceInfo,
        screenSize: metadata.screenSize,
        fingerprint: metadata.fingerprint
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          status.className = "text-center text-sm font-medium mt-2 text-green-600";
          status.innerText = "Order confirmed successfully!";
          setTimeout(() => { location.reload(); }, 2000);
        } else {
          status.className = "text-center text-sm font-medium mt-2 text-red-600";
          status.innerText = "Failed: " + (data.error || "Please try again.");
          confirmBtn.disabled = false;
          confirmBtn.innerText = "Confirm Receive";
        }
      })
      .catch(err => {
        status.className = "text-center text-sm font-medium mt-2 text-red-600";
        status.innerText = "Submission completed.";
        confirmBtn.disabled = false;
        confirmBtn.innerText = "Confirm Receive";
      });
    }
  </script>

</body>
</html>
