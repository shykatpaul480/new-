<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Requisition Confirmation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-lg border-t-4 border-orange-500">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Lab Requisition Confirmation</h2>

    <!-- Search Section -->
    <div id="searchSection" class="space-y-4">
      <label class="block text-sm font-semibold text-gray-700">Registration Number or Order ID</label>
      <div class="flex gap-2">
        <input type="text" id="searchQuery" placeholder="Enter Reg No / Order ID..." class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-orange-500 outline-none">
        <button id="searchBtn" onclick="searchOrder()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2 rounded-md transition">Search</button>
      </div>
      <p id="searchStatus" class="text-center text-sm font-medium hidden"></p>
    </div>

    <!-- Multiple Orders Container -->
    <div id="ordersContainer" class="hidden mt-6 space-y-6 border-t pt-4">
      <div class="flex justify-between items-center">
        <h3 class="text-md font-bold text-orange-600" id="orderHeaderCount">Found Orders</h3>
        <button onclick="resetSearch()" class="text-xs text-gray-500 hover:text-red-500 underline">🔍 New Search</button>
      </div>
      
      <!-- Dynamic Order Cards List will append here -->
      <div id="orderCardsList" class="space-y-6"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz0Ry_gVDYRuDPS1-kQkk3RjeloRlFvM3FyY7M-pIFIvCtXdXj-ym6CPud4F0XCZBnRZg/exec";
    
    let activeStreams = {}; // একাধিক ক্যামেরার স্ট্রিম হ্যান্ডেল করার জন্য

    // 1. Search Orders
    function searchOrder() {
      const query = document.getElementById('searchQuery').value.trim();
      const status = document.getElementById('searchStatus');
      const searchBtn = document.getElementById('searchBtn');

      if (!query) return;

      searchBtn.disabled = true;
      status.classList.remove('hidden');
      status.className = "text-center text-sm font-medium mt-2 text-orange-500";
      status.innerText = "Searching orders...";

      fetch(`${API_URL}?action=searchOrder&query=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          searchBtn.disabled = false;
          status.classList.add('hidden');
          if (data.result === "success" && data.orders.length > 0) {
            renderOrders(data.orders);
          } else {
            status.className = "text-center text-sm font-medium mt-2 text-red-600";
            status.innerText = "No active orders found or Access not granted!";
            document.getElementById('ordersContainer').classList.add('hidden');
          }
        })
        .catch(err => {
          searchBtn.disabled = false;
          status.className = "text-center text-sm font-medium mt-2 text-red-600";
          status.innerText = "Error searching orders.";
        });
    }

    // New Search Reset
    function resetSearch() {
      document.getElementById('ordersContainer').classList.add('hidden');
      document.getElementById('searchQuery').value = "";
      document.getElementById('searchSection').classList.remove('hidden');
    }

    // 2. Render Multiple Order Cards Dynamically
    function renderOrders(orders) {
      document.getElementById('searchSection').classList.add('hidden');
      const container = document.getElementById('orderCardsList');
      container.innerHTML = "";
      
      document.getElementById('orderHeaderCount').innerText = `Pending Orders (${orders.length})`;

      orders.forEach((order, index) => {
        const cardId = `orderCard_${index}`;
        const cardHTML = `
          <div id="${cardId}" class="bg-orange-50 border border-orange-200 rounded-lg p-4 space-y-3 shadow-sm">
            <div class="border-b pb-2">
              <span class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded font-bold">Order #${index + 1}</span>
              <p class="text-sm mt-1"><strong>Order ID:</strong> ${order.orderId}</p>
              <p class="text-sm"><strong>Reg No:</strong> ${order.regNo} | <strong>Name:</strong> ${order.name}</p>
              <p class="text-sm"><strong>Item:</strong> <span class="font-bold text-orange-700">${order.item}</span></p>
              <p class="text-sm"><strong>Quantity:</strong> <span class="font-bold">${order.quantity} ${order.unit || ''}</span></p>
            </div>

            <!-- Camera Section for this specific order -->
            <div class="space-y-2">
              <label class="block text-xs font-semibold text-gray-700">Live Verification Photo for this Item</label>
              
              <video id="webcam_${index}" autoplay playsinline class="w-full h-48 bg-black rounded-lg hidden border object-cover"></video>
              <canvas id="canvas_${index}" class="hidden"></canvas>
              
              <div id="previewContainer_${index}" class="hidden flex justify-center">
                <img id="imagePreview_${index}" src="" class="max-h-40 rounded-lg border shadow-sm">
              </div>

              <div class="flex gap-2">
                <button id="startCamBtn_${index}" onclick="startCamera(${index})" type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 rounded-md transition">
                  📷 Open Camera
                </button>
                <button id="captureBtn_${index}" onclick="takeSnapshot(${index})" type="button" class="w-full bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-2 rounded-md hidden transition">
                  📸 Take Photo
                </button>
              </div>

              <button id="confirmBtn_${index}" onclick="submitConfirmation(${index}, ${JSON.stringify(order).replace(/"/g, '&quot;')})" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2.5 rounded-md mt-2 transition hidden">
                Confirm & Submit Receive
              </button>
            </div>
            <p id="status_${index}" class="text-center text-xs font-medium hidden"></p>
          </div>
        `;
        container.innerHTML += cardHTML;
      });

      document.getElementById('ordersContainer').classList.remove('hidden');
    }

    // 3. Start Camera for Specific Index
    async function startCamera(index) {
      try {
        activeStreams[index] = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: { exact: "environment" } } 
        });
      } catch (err) {
        try {
          activeStreams[index] = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        } catch (fallbackErr) {
          activeStreams[index] = await navigator.mediaDevices.getUserMedia({ video: true });
        }
      }

      const video = document.getElementById(`webcam_${index}`);
      video.srcObject = activeStreams[index];
      video.classList.remove('hidden');
      document.getElementById(`previewContainer_${index}`).classList.add('hidden');
      
      document.getElementById(`startCamBtn_${index}`).classList.add('hidden');
      document.getElementById(`captureBtn_${index}`).classList.remove('hidden');
    }

    // 4. Take Snapshot & Watermark for Specific Index
    let base64Images = {};
    function takeSnapshot(index) {
      const video = document.getElementById(`webcam_${index}`);
      const canvas = document.getElementById(`canvas_${index}`);
      const context = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const now = new Date();
      const timeString = "Verified: " + now.toLocaleString();
      
      context.font = "bold 16px sans-serif";
      context.fillStyle = "rgba(0, 0, 0, 0.6)";
      context.fillRect(10, canvas.height - 35, context.measureText(timeString).width + 20, 25);
      
      context.fillStyle = "#ffffff";
      context.fillText(timeString, 20, canvas.height - 18);

      base64Images[index] = canvas.toDataURL('image/jpeg', 0.85);

      document.getElementById(`imagePreview_${index}`).src = base64Images[index];
      document.getElementById(`previewContainer_${index}`).classList.remove('hidden');

      if (activeStreams[index]) {
        activeStreams[index].getTracks().forEach(track => track.stop());
      }
      video.classList.add('hidden');
      document.getElementById(`captureBtn_${index}`).classList.add('hidden');
      document.getElementById(`startCamBtn_${index}`).innerText = "🔄 Retake";
      document.getElementById(`startCamBtn_${index}`).classList.remove('hidden');
      document.getElementById(`confirmBtn_${index}`).classList.remove('hidden');
    }

    // 5. Metadata Generator
    async function getDeviceMetadata() {
      const userAgent = navigator.userAgent;
      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const language = navigator.language;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      const rawFingerprint = `${userAgent}|${screenRes}|${language}|${timeZone}|${navigator.hardwareConcurrency || ''}`;
      
      const msgBuffer = new TextEncoder().encode(rawFingerprint);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const fingerprintHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      return {
        deviceInfo: userAgent,
        screenSize: screenRes,
        fingerprint: fingerprintHash
      };
    }

    // 6. Submit Specific Order Confirmation
    async function submitConfirmation(index, order) {
      if (!base64Images[index]) {
        alert("Please capture a live photo first!");
        return;
      }

      const confirmBtn = document.getElementById(`confirmBtn_${index}`);
      const status = document.getElementById(`status_${index}`);

      confirmBtn.disabled = true;
      confirmBtn.innerText = "Processing...";
      status.classList.remove('hidden');
      status.className = "text-center text-xs font-medium mt-2 text-orange-500";
      status.innerText = "Submitting verification...";

      const metadata = await getDeviceMetadata();

      const payload = {
        rowIndex: order.rowIndex,
        orderId: order.orderId,
        regNo: order.regNo,
        name: order.name,
        group: order.group,
        item: order.item,
        quantity: order.quantity,
        unit: order.unit,
        imageBase64: base64Images[index],
        deviceModel: metadata.deviceInfo,
        screenSize: metadata.screenSize,
        fingerprint: metadata.fingerprint
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          status.className = "text-center text-xs font-medium mt-2 text-green-600";
          status.innerText = "Confirmed successfully!";
          // Disable card elements after success
          document.getElementById(`orderCard_${index}`).style.opacity = "0.6";
          confirmBtn.remove();
          document.getElementById(`startCamBtn_${index}`).remove();
        } else {
          status.className = "text-center text-xs font-medium mt-2 text-red-600";
          status.innerText = "Failed: " + (data.error || "Try again.");
          confirmBtn.disabled = false;
          confirmBtn.innerText = "Confirm & Submit Receive";
        }
      })
      .catch(err => {
        status.className = "text-center text-xs font-medium mt-2 text-red-600";
        status.innerText = "Error in submission.";
        confirmBtn.disabled = false;
        confirmBtn.innerText = "Confirm & Submit Receive";
      });
    }
  </script>

</body>
</html>
