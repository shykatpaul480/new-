<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Chemical Requisition Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; max-width: 450px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>

  <h2>ল্যাব আইটেম রিকোয়েস্ট ফর্ম</h2>

  <form id="labForm">
    <div class="form-group">
      <label for="regNo">স্টুডেন্ট রেজিস্ট্রেশন নম্বর:</label>
      <input type="text" id="regNo" name="regNo" placeholder="যেমন: 2021-XXX-XXX" required>
    </div>

    <div class="form-group">
      <label for="itemSelect">রাসায়নিক/আইটেম সিলেক্ট করুন:</label>
      <select id="itemSelect" name="itemName" required>
        <option value="">আইটেম লোড হচ্ছে...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantity">পরিমাণ (Amount / Quantity):</label>
      <input type="text" id="quantity" name="quantity" placeholder="যেমন: 50 ml / 10 gram" required>
    </div>

    <button type="submit" id="submitBtn">সাবমিট করুন</button>
  </form>

  <p id="statusMsg"></p>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwA_gH50T9LzR1pNwAtVv_Aox3fmC33B1GVcNOjXZHfglTD4OUShx8k8cZIBKixNejHjg/exec";

    // গুগল শিট থেকে কেমিক্যালের লিস্ট এনে ড্রপডাউনে বসানো
    window.addEventListener('DOMContentLoaded', () => {
      fetch(API_URL)
        .then(res => res.json())
        .then(items => {
          const select = document.getElementById('itemSelect');
          select.innerHTML = '<option value="">-- আইটেম বেছে নিন --</option>';
          items.forEach(itemName => {
            const option = document.createElement('option');
            option.value = itemName;
            option.textContent = itemName;
            select.appendChild(option);
          });
        })
        .catch(err => {
          console.error(err);
          document.getElementById('itemSelect').innerHTML = '<option value="">আইটেম লোড করতে সমস্যা হয়েছে</option>';
        });
    });

    // ফর্ম সাবমিট করা
    document.getElementById('labForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      submitBtn.disabled = true;
      statusMsg.innerText = "প্রসেস হচ্ছে...";

      const formData = {
        regNo: document.getElementById('regNo').value,
        itemName: document.getElementById('itemSelect').value,
        quantity: document.getElementById('quantity').value
      };

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      })
      .then(() => {
        statusMsg.style.color = "green";
        statusMsg.innerText = "সফলভাবে সাবমিট হয়েছে!";
        document.getElementById('labForm').reset();
        submitBtn.disabled = false;
      })
      .catch(err => {
        statusMsg.style.color = "red";
        statusMsg.innerText = "সাবমিট করতে সমস্যা হয়েছে।";
        submitBtn.disabled = false;
      });
    });
  </script>

</body>
</html>
