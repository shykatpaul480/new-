<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Requisition Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Logo er color theme onujayi Tailwind e custom color set kora hoyeche
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#F26522', // Theme Orange
              black: '#1A1A1A',
              bg: '#F9FAFB'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-bg flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border-t-4 border-brand-orange">
    
    <h2 class="text-2xl font-bold text-center text-brand-black mb-6">Lab Chemical Requisition</h2>

    <form id="labForm" class="space-y-5">
      
      <!-- Registration Number Search/Select -->
      <div>
        <label for="regNo" class="block text-sm font-semibold text-brand-black mb-1">Registration Number</label>
        <input list="regList" id="regNo" name="regNo" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange transition-colors" placeholder="Search or Type Reg No..." required autocomplete="off">
        <datalist id="regList">
          <!-- Data asbe js theke -->
        </datalist>
      </div>

      <!-- Auto-filled Data (Name & Group) -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="studentName" class="block text-sm font-semibold text-brand-black mb-1">Student Name</label>
          <input type="text" id="studentName" class="w-full px-4 py-2 border border-gray-200 bg-gray-50 rounded-md text-gray-600 focus:outline-none" placeholder="Auto-filled" readonly required>
        </div>
        <div>
          <label for="studentGroup" class="block text-sm font-semibold text-brand-black mb-1">Group</label>
          <input type="text" id="studentGroup" class="w-full px-4 py-2 border border-gray-200 bg-gray-50 rounded-md text-gray-600 focus:outline-none" placeholder="Auto-filled" readonly required>
        </div>
      </div>

      <!-- Item Selection -->
      <div>
        <label for="itemSelect" class="block text-sm font-semibold text-brand-black mb-1">Select Chemical / Item</label>
        <select id="itemSelect" name="itemName" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange transition-colors bg-white" required>
          <option value="" disabled selected>Loading Items...</option>
        </select>
      </div>

      <!-- Quantity & Unit -->
      <div>
        <label class="block text-sm font-semibold text-brand-black mb-1">Quantity Requirement</label>
        <div class="flex gap-2">
          <input type="number" id="quantityAmount" placeholder="Amount (e.g. 50)" class="w-2/3 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange transition-colors" required min="1">
          <select id="quantityUnit" class="w-1/3 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange bg-white transition-colors">
            <option value="ml">ml</option>
            <option value="gram">gram</option>
            <option value="pcs">pcs</option>
            <option value="drop">drop</option>
          </select>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full bg-brand-orange hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-md transition-colors shadow-md mt-4 disabled:opacity-50">
        Submit Requisition
      </button>

      <p id="statusMsg" class="text-center text-sm font-medium mt-3 hidden"></p>
    </form>
  </div>

  <script>
    // এখানে আপনার Google Apps Script এর Web App URL বসানো আছে
    const API_URL = "https://script.google.com/macros/s/AKfycbwA_gH50T9LzR1pNwAtVv_Aox3fmC33B1GVcNOjXZHfglTD4OUShx8k8cZIBKixNejHjg/exec";
    
    let studentDataCache = []; // Student data fast search er jonno cache korlam

    // Page Load hobar sathe sathe Data niye asa
    window.addEventListener('DOMContentLoaded', () => {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          // 1. Load Items
          const select = document.getElementById('itemSelect');
          select.innerHTML = '<option value="" disabled selected>-- Select an Item --</option>';
          data.items.forEach(itemName => {
            const option = document.createElement('option');
            option.value = itemName;
            option.textContent = itemName;
            select.appendChild(option);
          });

          // 2. Load Students in Datalist & Cache them
          const regList = document.getElementById('regList');
          studentDataCache = data.students;
          studentDataCache.forEach(student => {
            const option = document.createElement('option');
            option.value = student.regNo;
            regList.appendChild(option);
          });
        })
        .catch(err => console.error('Data Loading Error:', err));
    });

    // Registration Number likhle sathe sathe Name & Group Auto-fill kora
    document.getElementById('regNo').addEventListener('input', function(e) {
      const inputVal = e.target.value;
      const matchedStudent = studentDataCache.find(s => s.regNo === inputVal);
      
      if (matchedStudent) {
        document.getElementById('studentName').value = matchedStudent.name;
        document.getElementById('studentGroup').value = matchedStudent.group;
      } else {
        document.getElementById('studentName').value = '';
        document.getElementById('studentGroup').value = '';
      }
    });

    // Form Submit logic
    document.getElementById('labForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Processing...";
      statusMsg.classList.remove('hidden');
      statusMsg.className = "text-center text-sm font-medium mt-3 text-orange-500";
      statusMsg.innerText = "Submitting to database...";

      // Combine Amount and Unit
      const amount = document.getElementById('quantityAmount').value;
      const unit = document.getElementById('quantityUnit').value;
      const combinedQuantity = `${amount} ${unit}`;

      const formData = {
        regNo: document.getElementById('regNo').value,
        name: document.getElementById('studentName').value,
        group: document.getElementById('studentGroup').value,
        itemName: document.getElementById('itemSelect').value,
        quantity: combinedQuantity
      };

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        statusMsg.className = "text-center text-sm font-medium mt-3 text-green-600";
        statusMsg.innerText = "Successfully Submitted!";
        document.getElementById('labForm').reset();
        
        setTimeout(() => {
          statusMsg.classList.add('hidden');
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Requisition";
        }, 3000);
      })
      .catch(err => {
        statusMsg.className = "text-center text-sm font-medium mt-3 text-red-600";
        statusMsg.innerText = "Submission Failed. Try again.";
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Requisition";
      });
    });
  </script>

</body>
</html>
